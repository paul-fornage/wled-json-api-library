openapi: 3.1.0
info:
  title: WLED Nodes
  version: 1.0.0

components:
  schemas:
    Nodes:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'

    Node:
      type: object
      properties:
        name:
          type: string
          description: "Not a trick question, really just the name of the corresponding node"
        type:
          type: integer
          format: uint8
          minimum: 0
          maximum: 255
          description: |
            'a waste of space as we only have 5 types'
                - the WLED source code

            #define NODE_TYPE_ID_UNDEFINED        0
            #define NODE_TYPE_ID_ESP8266         82 // should be 1
            #define NODE_TYPE_ID_ESP32           32 // should be 2
            #define NODE_TYPE_ID_ESP32S2         33 // etc
            #define NODE_TYPE_ID_ESP32S3         34
            #define NODE_TYPE_ID_ESP32C3         35


            Considering the above, this field may be changed by the time you are using this
        ip:
          type: string
          description: "Not a trick question, really just IP address"
        age:
          type: integer
          format: uint8
          minimum: 0
          maximum: 255
          description: "We have our top 4 engineers on the case, we'll know aht this is in about 3 years"
        vid:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: "We have our top 4 engineers on the case, we'll know aht this is in about 3 years"
