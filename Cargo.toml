[package]
name = "wled-json-api-library"
version = "0.1.7"
edition = "2021"
license = "MIT"
keywords = ["protocol", "json", "pixel", "wled", "api"]
categories = ["network-programming", "api-bindings"]
description = "WLED Json API in rust. Made with WLED ~14.0, but should work for more"
repository = "https://github.com/paulwrath1223/wled-json-api-library"

[features]
default = ["reqwest"]
reqwest = ["tokio"]

[dependencies]
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
serde-aux-ext = "0.2.0"
# reqwest defaults to async, blocking is optional
reqwest = { version = "0.13.1", features = ["gzip"], optional = true }
serde_repr = "0.1.17"
thiserror = "2.0.17"
# tokio is optional, needed for async support
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }